<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nos Recettes</title>
<meta name="description" content="Le carnet de recettes partagé de la maison, avec la liste de courses.">
<meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171715" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Recettes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,400&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<section class="login" id="login" hidden>
  <h1>Nos Recettes</h1>
  <p>Le carnet partagé de la maison. Connectez-vous une fois sur chaque appareil, l'appli s'en souvient ensuite.</p>
  <form id="login-form">
    <label for="login-email" class="status">Adresse e-mail</label>
    <input id="login-email" type="email" autocomplete="email" required placeholder="prenom@exemple.fr">
    <label for="login-pass" class="status">Mot de passe</label>
    <input id="login-pass" type="password" autocomplete="current-password" minlength="6" placeholder="6 caractères minimum">
    <button class="btn primary" id="login-btn" value="in">Se connecter</button>
    <button class="btn" id="signup-btn" value="up">Créer mon compte</button>
    <button type="button" class="signout" id="link-btn">Mot de passe oublié ? Recevoir un lien par e-mail</button>
  </form>
  <p class="msg" id="login-msg" hidden></p>
</section>
<div id="shell" hidden>
<div class="wrap">
  <header class="top">
    <h1>Nos Recettes<small id="sub">Le carnet partagé de la maison</small></h1>
    <nav class="tabs" aria-label="Sections">
      <button id="t-recettes" data-view="recettes" aria-current="page"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 7h6M9 11h6"/></svg>Recettes</button>
      <button id="t-menu" data-view="menu"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 13V3M3 3v6a2 2 0 0 0 4 0V3M5 9v12M19 3c-2 2-2 6 0 8v10"/></svg>Menu <span class="badge" id="b-menu"></span></button>
      <button id="t-courses" data-view="courses"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1"/><circle cx="17" cy="20.5" r="1"/></svg>Courses <span class="badge" id="b-courses"></span></button>
    </nav>
    <button class="acct-btn" id="acct-btn" aria-label="Mon compte"><span id="acct-init">?</span></button>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>
<dialog class="acct" id="acct">
  <div class="acct-head">
    <span class="acct-av" id="acct-av">?</span>
    <div><h2 id="acct-name">Mon compte</h2><p id="acct-email"></p></div>
    <button class="acct-x" id="acct-close" aria-label="Fermer"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <form id="acct-name-form">
    <label for="acct-name-in" class="status">Prénom</label>
    <div class="acct-row"><input id="acct-name-in" autocomplete="given-name" maxlength="40" placeholder="Votre prénom"><button class="btn">Enregistrer</button></div>
  </form>
  <form id="acct-pass-form">
    <label for="acct-pass-in" class="status">Nouveau mot de passe</label>
    <div class="acct-row"><input id="acct-pass-in" type="password" autocomplete="new-password" minlength="6" required placeholder="6 caractères minimum"><button class="btn">Changer</button></div>
  </form>
  <p class="acct-msg" id="acct-msg" role="status" hidden></p>
  <p class="acct-since" id="acct-since"></p>
  <button class="btn acct-out" id="signout">Se déconnecter</button>
</dialog>
</div>
<script src="/vendor/supabase-2.45.4.js"></script>
<script src="/config.js"></script>
<script src="/shim.js"></script>
<script src="/app.js"></script>
<script src="/start.js"></script>
</body>
</html>
