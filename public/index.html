<body>
<section class="login" id="login" hidden>
  <h1>Nos Recettes</h1>
  <p>Le carnet partagé de la maison. Entrez votre adresse e-mail : vous recevrez un lien pour vous connecter, une seule fois par appareil.</p>
  <form id="login-form">
    <label for="login-email" class="status">Adresse e-mail</label>
    <input id="login-email" type="email" autocomplete="email" required placeholder="prenom@exemple.fr">
    <button class="btn primary" id="login-btn">Recevoir le lien de connexion</button>
  </form>
  <p class="msg" id="login-msg" hidden></p>
</section>
<div id="shell" hidden>
<div class="wrap">
  <header class="top">
    <h1>Nos Recettes<small id="sub">Le carnet partagé de la maison</small></h1>
    <nav class="tabs" aria-label="Sections">
      <button id="t-recettes" data-view="recettes" aria-current="page"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/><path d="M9 7h6M9 11h6"/></svg>Recettes</button>
      <button id="t-menu" data-view="menu"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 13V3M3 3v6a2 2 0 0 0 4 0V3M5 9v12M19 3c-2 2-2 6 0 8v10"/></svg>Menu <span class="badge" id="b-menu"></span></button>
      <button id="t-courses" data-view="courses"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20.5" r="1"/><circle cx="17" cy="20.5" r="1"/></svg>Courses <span class="badge" id="b-courses"></span></button>
    </nav>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast" hidden></div>
<p style="text-align:center;margin:40px 0 0"><button class="signout" id="signout">Se déconnecter</button></p>
</div>
